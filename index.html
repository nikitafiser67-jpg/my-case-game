<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Кейс Бот</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial; background: #0f0f1a; user-select: none; -webkit-tap-highlight-color: transparent; color: white; }

        #coinCounter {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 30px;
            border: 2px solid rgba(255,215,0,0.4);
            color: #ffd700; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; z-index: 15;
            pointer-events: none;
        }
        #coinCounter span { font-size: 24px; }

        #status {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.6); padding: 8px 20px;
            border-radius: 20px; font-size: 13px; backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1); pointer-events: none; z-index: 10;
            white-space: nowrap;
        }

        #casesWrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            padding: 80px 0 100px 0;
        }

        #cases {
            display: flex; gap: 15px; padding: 0 20px;
            overflow-x: auto; overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            max-width: 100%;
        }
        #cases::-webkit-scrollbar { display: none; }

        .case {
            flex: 0 0 150px; height: 210px;
            background: linear-gradient(145deg, #1e1e3a, #2a2a4a);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; cursor: pointer;
            transition: all 0.3s; touch-action: manipulation;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            scroll-snap-align: center;
        }
        .case:active { transform: scale(0.95); }
        .case .case-emoji { font-size: 55px; }
        .case .case-name { font-size: 14px; font-weight: bold; text-align: center; }
        .case .case-price { font-size: 17px; color: #ffd700; font-weight: bold; }
        .case .case-rarity { font-size: 11px; opacity: 0.6; }
        .case.locked { opacity: 0.5; }
        .case.locked .case-price { color: #95a5a6; }

        /* ---- ОКНО КЕЙСА (рулетка сверху + сетка снизу) ---- */
        #casePreview {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(20px);
            z-index: 100; display: none; flex-direction: column;
            padding: 15px; overflow-y: auto;
        }
        #casePreview.active { display: flex; }

        #casePreview .preview-header {
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 12px; flex-shrink: 0;
        }
        #casePreview .preview-emoji { font-size: 40px; }
        #casePreview .preview-name { font-size: 20px; font-weight: bold; }
        #casePreview .preview-price { font-size: 15px; color: #ffd700; }

        /* ---- РУЛЕТКА СВЕРХУ ---- */
        #rouletteWindowInline {
            width: 100%;
            max-width: 500px;
            height: 110px;
            background: #1a1a2e;
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.3);
            overflow: hidden;
            position: relative;
            margin: 0 auto 15px auto;
            flex-shrink: 0;
        }

        #rouletteTrackInline {
            display: flex;
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            align-items: center;
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
        }

        #roulettePointerInline {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ffd700;
            z-index: 5;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .roulette-item {
            flex: 0 0 90px;
            height: 90px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 4px;
            background: rgba(255,255,255,0.05); margin: 0 5px;
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .roulette-item .item-emoji { font-size: 34px; }
        .roulette-item .item-image { width: 60px; height: 60px; object-fit: contain; display: block; }
        .roulette-item .item-name { font-size: 8px; text-align: center; padding: 0 2px; }
        .roulette-item.rare { border-color: #3498db; background: rgba(52,152,219,0.1); }
        .roulette-item.epic { border-color: #9b59b6; background: rgba(155,89,182,0.1); }
        .roulette-item.legendary { border-color: #ffd700; background: rgba(255,215,0,0.1); }

        /* ---- СЕТКА 5x5 СНИЗУ ---- */
        #casePreview .preview-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 4px;
            position: relative;
            overflow: hidden;
        }
        .grid-item.legendary { border-color: #ffd700; background: rgba(255,215,0,0.08); }
        .grid-item.epic { border-color: #9b59b6; background: rgba(155,89,182,0.08); }
        .grid-item.rare { border-color: #3498db; background: rgba(52,152,219,0.08); }

        .grid-item .item-img { width: 70%; height: 70%; object-fit: contain; }
        .grid-item .item-emoji { font-size: 28px; }
        .grid-item .item-chance {
            position: absolute;
            bottom: 2px; right: 4px;
            font-size: 10px; font-weight: bold;
            color: #ffd700;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 6px;
        }

        #casePreview .preview-buttons {
            display: flex; gap: 12px;
            justify-content: center;
            flex-shrink: 0;
            padding-bottom: 10px;
            margin-top: auto;
        }
        #casePreview .preview-btn {
            padding: 14px 40px; border-radius: 30px; border: none;
            font-size: 18px; font-weight: bold; cursor: pointer;
            touch-action: manipulation;
        }
        #casePreview .preview-btn.open-btn { background: #2ecc71; color: white; }
        #casePreview .preview-btn.open-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        #casePreview .preview-btn.close-btn { background: rgba(255,255,255,0.1); color: white; }

        /* ---- ИНВЕНТАРЬ ---- */
        #inventoryToggle {
            position: absolute; bottom: 25px; right: 20px;
            background: rgba(155,89,182,0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            width: 60px; height: 60px; border-radius: 50%; font-size: 28px;
            cursor: pointer; z-index: 20; touch-action: manipulation;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #inventoryToggle:active { transform: scale(0.9); }

        #dailyBonus {
            position: absolute; bottom: 25px; left: 20px;
            background: rgba(46,204,113,0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            width: 60px; height: 60px; border-radius: 50%; font-size: 28px;
            cursor: pointer; z-index: 20; touch-action: manipulation;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
        }
        #dailyBonus:active { transform: scale(0.9); }
        #dailyBonus.claimed { background: rgba(100,100,100,0.5); opacity: 0.5; }

        #inventoryMenu {
            position: absolute; bottom: -100%; left: 0; width: 100%;
            background: rgba(20,20,40,0.98); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(155,89,182,0.3);
            padding: 20px 16px 30px; z-index: 30;
            transition: bottom 0.4s cubic-bezier(0.4,0,0.2,1);
            max-height: 65vh; overflow-y: auto; border-radius: 20px 20px 0 0;
        }
        #inventoryMenu.open { bottom: 0; }
        #inventoryMenu::-webkit-scrollbar { width: 3px; }
        #inventoryMenu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .menu-header {
            display: flex; justify-content: space-between; align-items: center;
            color: white; margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .menu-header h3 { font-size: 18px; font-weight: 600; }
        .menu-close {
            background: rgba(255,255,255,0.1); border: none; color: white;
            font-size: 24px; width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; touch-action: manipulation;
        }
        .menu-close:active { transform: scale(0.9); }

        .inventory-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; margin-bottom: 6px;
            background: rgba(255,255,255,0.05); border-radius: 12px;
            border-left: 3px solid #ffd700;
        }
        .inventory-item .info { display: flex; align-items: center; gap: 10px; }
        .inventory-item .emoji { font-size: 28px; }
        .inventory-item .item-img { width: 36px; height: 36px; object-fit: contain; }
        .inventory-item .name { font-size: 13px; }
        .inventory-item .rarity { font-size: 11px; opacity: 0.6; }
        .inventory-item .sell-btn {
            background: rgba(46,204,113,0.2); border: 1px solid #2ecc71;
            color: white; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; cursor: pointer; touch-action: manipulation;
        }
        .inventory-item .sell-btn:active { transform: scale(0.9); }
        .inventory-item.rare { border-left-color: #3498db; }
        .inventory-item.epic { border-left-color: #9b59b6; }
        .inventory-item.legendary { border-left-color: #ffd700; }

        #emptyInventory {
            text-align: center; color: rgba(255,255,255,0.4); padding: 30px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .case { flex: 0 0 130px; height: 180px; }
            .case .case-emoji { font-size: 45px; }
            .case .case-name { font-size: 12px; }
            .case .case-price { font-size: 15px; }
            #inventoryToggle { bottom: 20px; right: 15px; width: 54px; height: 54px; font-size: 24px; }
            #dailyBonus { bottom: 20px; left: 15px; width: 54px; height: 54px; font-size: 24px; }
            #coinCounter { font-size: 16px; padding: 6px 14px; top: 10px; left: 10px; }
            #coinCounter span { font-size: 18px; }
            #status { font-size: 11px; padding: 6px 14px; }
            .inventory-item .name { font-size: 11px; }
            .inventory-item .sell-btn { font-size: 11px; padding: 4px 10px; }
            #casePreview .preview-name { font-size: 16px; }
            #casePreview .preview-emoji { font-size: 30px; }
            #casePreview .preview-btn { padding: 12px 25px; font-size: 15px; }
            #casePreview .preview-grid { gap: 5px; }
            .grid-item .item-emoji { font-size: 20px; }
            .grid-item .item-chance { font-size: 8px; }
            #rouletteWindowInline { height: 90px; }
            .roulette-item { flex: 0 0 75px; height: 75px; }
            .roulette-item .item-image { width: 50px; height: 50px; }
            .roulette-item .item-emoji { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div id="coinCounter">
        <span>🪙</span> <span id="coinCount">0</span>
    </div>

    <div id="status">🎰 Выбери кейс</div>

    <div id="casesWrapper">
        <div id="cases"></div>
    </div>

    <!-- ОКНО КЕЙСА: РУЛЕТКА СВЕРХУ + СЕТКА СНИЗУ -->
    <div id="casePreview">
        <div class="preview-header">
            <div class="preview-emoji" id="previewEmoji">🎁</div>
            <div>
                <div class="preview-name" id="previewName">Кейс</div>
                <div class="preview-price" id="previewPrice">🪙 0</div>
            </div>
        </div>

        <!-- РУЛЕТКА СВЕРХУ -->
        <div id="rouletteWindowInline">
            <div id="roulettePointerInline"></div>
            <div id="rouletteTrackInline"></div>
        </div>

        <!-- СЕТКА 5x5 СНИЗУ -->
        <div class="preview-grid" id="previewGrid"></div>

        <!-- КНОПКИ -->
        <div class="preview-buttons">
            <button class="preview-btn open-btn" id="previewOpenBtn">Открыть</button>
            <button class="preview-btn close-btn" id="previewCloseBtn">Закрыть</button>
        </div>
    </div>

    <button id="dailyBonus">🎁</button>
    <button id="inventoryToggle">🎒</button>

    <div id="inventoryMenu">
        <div class="menu-header">
            <h3>🎒 Инвентарь</h3>
            <button class="menu-close" id="closeInventory">✕</button>
        </div>
        <div id="inventoryList"></div>
    </div>

    <script>
        // ---- ЗВУК ----
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            return audioCtx;
        }

        function playSound(freq, duration) {
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function playCoinSound() {
            playSound(1200, 0.15);
            setTimeout(() => playSound(1600, 0.1), 50);
        }

        // ---- РЕДКОСТИ ----
        const rarities = {
            common: { name: 'Обычный', color: '#95a5a6' },
            rare: { name: 'Редкий', color: '#3498db' },
            epic: { name: 'Эпический', color: '#9b59b6' },
            legendary: { name: 'Легендарный', color: '#ffd700' },
        };

        // ---- ПРЕДМЕТЫ ДЛЯ КЕЙСА "КАЛАШИ" ----
        const kalashItems = [
            { id: 'k1', name: 'Штурмовая винтовка (Memento More)', emoji: '🔫', rarity: 'legendary', price: 2500 },
            { id: 'k2', name: 'Штурмовая винтовка (Ледяной раскол)', image: 'ice.png', rarity: 'legendary', price: 1500 },
            { id: 'k3', name: 'Штурмовая винтовка (Удар яда)', emoji: '☠️', rarity: 'legendary', price: 1000 },
            { id: 'k4', name: 'Штурмовая винтовка (Цифровой потрошитель)', emoji: '💻', rarity: 'legendary', price: 850 },
            { id: 'k5', name: 'Штурмовая винтовка (Рука мертвеца)', emoji: '💀', rarity: 'legendary', price: 800 },
            { id: 'k6', name: 'Штурмовая винтовка (Спект)', emoji: '👻', rarity: 'legendary', price: 750 },
            { id: 'k7', name: 'Штурмовая винтовка (Щупальца Кракена)', emoji: '🐙', rarity: 'legendary', price: 580 },
            { id: 'k8', name: 'Штурмовая винтовка (Гроза района)', emoji: '⚡', rarity: 'legendary', price: 550 },
            { id: 'k9', name: 'Штурмовая винтовка (Великолепная пятёрка)', emoji: '⭐', rarity: 'legendary', price: 500 },
            { id: 'k10', name: 'Штурмовая винтовка (Страж Вальхаллы)', emoji: '🛡️', rarity: 'legendary', price: 500 },
            { id: 'k11', name: 'Штурмовая винтовка (Ветер смерти)', emoji: '🌪️', rarity: 'legendary', price: 450 },
            { id: 'k12', name: 'Штурмовая винтовка (Шёпот предков)', emoji: '🗣️', rarity: 'legendary', price: 450 },
            { id: 'k13', name: 'Штурмовая винтовка (Золотой феникс)', emoji: '🔥', rarity: 'epic', price: 300 },
            { id: 'k14', name: 'Штурмовая винтовка (Кислотный автомат)', emoji: '🧪', rarity: 'epic', price: 250 },
            { id: 'k15', name: 'Штурмовая винтовка (Огненная лента)', emoji: '🎗️', rarity: 'rare', price: 150 },
            { id: 'k16', name: 'Штурмовая винтовка (Нагретая сталь)', emoji: '🔩', rarity: 'rare', price: 150 },
        ];

        // ---- ПРЕДМЕТЫ ДЛЯ КЕЙСА "ВИНТОВКИ" (пока пусто) ----
        const rifleItems = [];

        // ---- КЕЙСЫ ----
        const cases = [
            {
                id: 'case_kalash',
                name: 'Калаши',
                emoji: '🔫',
                price: 1,
                rarity: 'epic',
                chances: { common: 0, rare: 20, epic: 35, legendary: 45 },
                items: kalashItems
            },
            {
                id: 'case_rifle',
                name: 'Винтовки',
                emoji: '🎯',
                price: 150,
                rarity: 'legendary',
                chances: { common: 0, rare: 20, epic: 35, legendary: 45 },
                items: rifleItems,
                locked: true
            },
        ];

        // ---- СОСТОЯНИЕ ----
        let coins = 1000;
        let inventory = [];
        let lastBonus = 0;
        let isFirstTime = true;
        let currentCase = null;

        try {
            const savedCoins = localStorage.getItem('caseCoins');
            if (savedCoins !== null) {
                coins = parseInt(savedCoins) || 0;
                isFirstTime = false;
            }
            const savedInv = localStorage.getItem('caseInventory');
            if (savedInv) inventory = JSON.parse(savedInv);
            const savedBonus = localStorage.getItem('lastBonus');
            if (savedBonus) lastBonus = parseInt(savedBonus) || 0;
        } catch(e) {}

        if (isFirstTime) {
            try { localStorage.setItem('caseCoins', 1000); } catch(e) {}
        }

        const coinDisplay = document.getElementById('coinCount');
        function updateCoins() {
            coinDisplay.textContent = coins;
            try { localStorage.setItem('caseCoins', coins); } catch(e) {}
        }
        updateCoins();

        function saveInventory() {
            try { localStorage.setItem('caseInventory', JSON.stringify(inventory)); } catch(e) {}
        }

        // ---- КЕЙСЫ ----
        function renderCases() {
            const container = document.getElementById('cases');
            container.innerHTML = cases.map(c => 
                '<div class="case' + (c.locked ? ' locked' : '') + '" data-id="' + c.id + '">' +
                    '<div class="case-emoji">' + c.emoji + '</div>' +
                    '<div class="case-name">' + c.name + '</div>' +
                    '<div class="case-price">' + (c.locked ? '🔒 Скоро' : '🪙 ' + c.price) + '</div>' +
                    '<div class="case-rarity">' + rarities[c.rarity].name + '</div>' +
                '</div>'
            ).join('');

            container.querySelectorAll('.case').forEach(el => {
                el.addEventListener('click', () => showCasePreview(el.dataset.id));
            });
        }

        // ---- ОКНО КЕЙСА ----
        function showCasePreview(id) {
            const c = cases.find(x => x.id === id);
            if (!c) return;
            if (c.locked) {
                document.getElementById('status').textContent = '🔒 Кейс скоро откроется!';
                setTimeout(() => document.getElementById('status').textContent = '🎰 Выбери кейс', 1500);
                return;
            }
            if (!c.items || c.items.length === 0) {
                document.getElementById('status').textContent = '⚠️ В кейсе пока нет предметов';
                setTimeout(() => document.getElementById('status').textContent = '🎰 Выбери кейс', 1500);
                return;
            }
            currentCase = c;

            document.getElementById('previewEmoji').textContent = c.emoji;
            document.getElementById('previewName').textContent = c.name;
            document.getElementById('previewPrice').textContent = '🪙 ' + c.price;

            // Очищаем рулетку
            document.getElementById('rouletteTrackInline').innerHTML = '';
            document.getElementById('rouletteTrackInline').style.transform = 'translateX(0)';

            // Сортируем по цене (от дорогих к дешёвым)
            const sortedItems = [...c.items].sort((a, b) => b.price - a.price);

            const rarityChances = {
                legendary: c.chances.legendary || 0,
                epic: c.chances.epic || 0,
                rare: c.chances.rare || 0,
                common: c.chances.common || 0,
            };
            const rarityCounts = {};
            sortedItems.forEach(item => {
                rarityCounts[item.rarity] = (rarityCounts[item.rarity] || 0) + 1;
            });

            const grid = document.getElementById('previewGrid');
            grid.innerHTML = sortedItems.map(item => {
                const rarityChance = rarityChances[item.rarity] || 0;
                const count = rarityCounts[item.rarity] || 1;
                const itemChance = (rarityChance / count).toFixed(1);

                const imgContent = item.image 
                    ? '<img class="item-img" src="' + item.image + '" alt="' + item.name + '" title="' + item.name + '">' 
                    : '<span class="item-emoji">' + item.emoji + '</span>';

                return '<div class="grid-item ' + item.rarity + '">' +
                    imgContent +
                    '<div class="item-chance">' + itemChance + '%</div>' +
                '</div>';
            }).join('');

            const openBtn = document.getElementById('previewOpenBtn');
            if (coins < c.price) {
                openBtn.disabled = true;
                openBtn.textContent = '❌ Мало монет';
            } else {
                openBtn.disabled = false;
                openBtn.textContent = 'Открыть за 🪙 ' + c.price;
            }

            document.getElementById('casePreview').classList.add('active');
        }

        // Закрыть окно
        document.getElementById('previewCloseBtn').onclick = () => {
            document.getElementById('casePreview').classList.remove('active');
        };

        // ---- ОТКРЫТЬ КЕЙС (рулетка внутри окна) ----
        document.getElementById('previewOpenBtn').onclick = () => {
            if (!currentCase) return;
            if (coins < currentCase.price) return;

            const c = currentCase;
            coins -= c.price;
            updateCoins();
            playCoinSound();

            const rarity = getRandomRarity(c.chances);
            let items = c.items.filter(i => i.rarity === rarity);
            if (items.length === 0) {
                items = c.items;
            }
            const item = items[Math.floor(Math.random() * items.length)];

            // Запускаем рулетку ВНУТРИ окна
            spinInlineRoulette(c, item);

            // Блокируем кнопку, пока крутится
            const openBtn = document.getElementById('previewOpenBtn');
            openBtn.disabled = true;
            openBtn.textContent = '🎡 Крутится...';
        };

        function getRandomRarity(chances) {
            const roll = Math.random() * 100;
            let cumulative = 0;
            const order = ['legendary', 'epic', 'rare', 'common'];
            for (const r of order) {
                cumulative += chances[r] || 0;
                if (roll < cumulative) return r;
            }
            return 'legendary';
        }

        // ---- РУЛЕТКА ВНУТРИ ОКНА ----
        function spinInlineRoulette(c, winningItem) {
            const track = document.getElementById('rouletteTrackInline');
            const winEl = document.getElementById('rouletteWindowInline');

            const items = [];
            for (let i = 0; i < 30; i++) {
                items.push(c.items[Math.floor(Math.random() * c.items.length)]);
            }
            items[20] = winningItem;

            track.innerHTML = items.map(item => {
                const imgContent = item.image 
                    ? '<img class="item-image" src="' + item.image + '" alt="' + item.name + '">' 
                    : '<div class="item-emoji">' + item.emoji + '</div>';
                return '<div class="roulette-item ' + item.rarity + '">' +
                    imgContent +
                    '<div class="item-name">' + item.name + '</div>' +
                '</div>';
            }).join('');

            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            void track.offsetWidth;

            // Ширина одного элемента = 90px + 10px (margin) = 100px
            const itemWidth = 100;
            const winWidth = winEl.offsetWidth;
            const targetPos = -(20 * itemWidth) + (winWidth / 2) - (itemWidth / 2);

            track.style.transition = 'transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)';
            track.style.transform = 'translateX(' + targetPos + 'px)';

            setTimeout(() => {
                const r = rarities[winningItem.rarity];
                playCoinSound();

                inventory.push(winningItem);
                saveInventory();
                renderInventory();

                document.getElementById('status').textContent = '🎁 Выпало: ' + winningItem.name;

                const openBtn = document.getElementById('previewOpenBtn');
                openBtn.disabled = false;
                if (coins < c.price) {
                    openBtn.disabled = true;
                    openBtn.textContent = '❌ Мало монет';
                } else {
                    openBtn.textContent = 'Открыть за 🪙 ' + c.price;
                }

                setTimeout(() => {
                    document.getElementById('status').textContent = '🎰 Выбери кейс';
                }, 2500);
            }, 6200);
        }

        // ---- ИНВЕНТАРЬ ----
        function renderInventory() {
            const list = document.getElementById('inventoryList');
            if (inventory.length === 0) {
                list.innerHTML = '<div id="emptyInventory">Инвентарь пуст 😢</div>';
                return;
            }
            list.innerHTML = inventory.map((item, index) => {
                const r = rarities[item.rarity];
                const imgContent = item.image 
                    ? '<img class="item-img" src="' + item.image + '" alt="' + item.name + '">' 
                    : '<span class="emoji">' + item.emoji + '</span>';
                return '<div class="inventory-item ' + item.rarity + '">' +
                    '<div class="info">' +
                        imgContent +
                        '<div>' +
                            '<div class="name">' + item.name + '</div>' +
                            '<div class="rarity" style="color:' + r.color + '">' + r.name + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<button class="sell-btn" data-index="' + index + '">🪙 ' + item.price + '</button>' +
                '</div>';
            }).join('');

            list.querySelectorAll('.sell-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    const item = inventory[idx];
                    if (!item) return;
                    coins += item.price;
                    updateCoins();
                    playCoinSound();
                    inventory.splice(idx, 1);
                    saveInventory();
                    renderInventory();
                    document.getElementById('status').textContent = '💰 Продано за ' + item.price + ' 🪙';
                    setTimeout(() => document.getElementById('status').textContent = '🎰 Выбери кейс', 1500);
                });
            });
        }

        const invMenu = document.getElementById('inventoryMenu');
        document.getElementById('inventoryToggle').onclick = () => {
            invMenu.classList.toggle('open');
            renderInventory();
        };
        document.getElementById('closeInventory').onclick = () => {
            invMenu.classList.remove('open');
        };

        // ---- ЕЖЕДНЕВНЫЙ БОНУС ----
        function checkDailyBonus() {
            const now = Date.now();
            const dayMs = 24 * 60 * 60 * 1000;
            if (now - lastBonus > dayMs) {
                document.getElementById('dailyBonus').classList.remove('claimed');
            } else {
                document.getElementById('dailyBonus').classList.add('claimed');
            }
        }

        document.getElementById('dailyBonus').onclick = () => {
            const now = Date.now();
            const dayMs = 24 * 60 * 60 * 1000;
            if (now - lastBonus < dayMs) {
                const hoursLeft = Math.ceil((dayMs - (now - lastBonus)) / (60 * 60 * 1000));
                document.getElementById('status').textContent = '⏳ Бонус через ' + hoursLeft + ' ч.';
                setTimeout(() => document.getElementById('status').textContent = '🎰 Выбери кейс', 2000);
                return;
            }
            const bonus = 100;
            coins += bonus;
            lastBonus = now;
            try { localStorage.setItem('lastBonus', lastBonus); } catch(e) {}
            updateCoins();
            playCoinSound();
            document.getElementById('dailyBonus').classList.add('claimed');
            document.getElementById('status').textContent = '🎁 Бонус +' + bonus + ' 🪙!';
            setTimeout(() => document.getElementById('status').textContent = '🎰 Выбери кейс', 2000);
        };

        checkDailyBonus();

        // ---- СТАРТ ----
        renderCases();
        renderInventory();

        console.log('🎰 Игра запущена!');
    </script>
</body>
</html>
